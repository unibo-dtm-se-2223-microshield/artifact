[tool.poetry]
name = "dashield"
version = "0.1.0"
description = "MicroShield Supervisory MLOps Fleet Orchestrator & Live Dashboard"
authors = ["WeAreMassive <student@unibo.it>"]
readme = "README.md"
packages = [{include = "dashield"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26.0"
scikit-learn = "^1.3.0"
dash = "^2.14.0"
plotly = "^5.18.0"
pyserial = "^3.5"
cobs = "^1.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
mypy = "^1.7.0"
black = "^23.11.0"
flake8 = "^6.1.0"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
